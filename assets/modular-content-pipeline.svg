<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" rx="30" fill="#f6f3eb"/>
  <text x="60" y="75" font-size="36" font-family="sans-serif" font-weight="700" fill="#164f4b">从一次核验，到多个平台</text>

  <rect x="60" y="120" width="260" height="90" rx="20" fill="#e7f4f0" stroke="#83bdb5"/>
  <rect x="60" y="250" width="260" height="90" rx="20" fill="#e7f4f0" stroke="#83bdb5"/>
  <rect x="60" y="380" width="260" height="90" rx="20" fill="#e7f4f0" stroke="#83bdb5"/>
  <text x="100" y="175" font-size="25" font-family="sans-serif" fill="#164f4b">每日新闻研究</text>
  <text x="88" y="305" font-size="25" font-family="sans-serif" fill="#164f4b">GitHub 热门研究</text>
  <text x="86" y="435" font-size="25" font-family="sans-serif" fill="#164f4b">AI 新发现研究</text>

  <rect x="445" y="265" width="280" height="110" rx="20" fill="#fff" stroke="#f28b36" stroke-width="3"/>
  <text x="490" y="320" font-size="27" font-family="sans-serif" font-weight="700" fill="#7e4b20">标准内容包 v1</text>

  <rect x="850" y="190" width="280" height="100" rx="20" fill="#e8f1fb" stroke="#759fc9"/>
  <rect x="850" y="350" width="280" height="100" rx="20" fill="#eee" stroke="#aaa" stroke-dasharray="8 7"/>
  <text x="908" y="250" font-size="25" font-family="sans-serif" fill="#234d77">公众号内容制作</text>
  <text x="914" y="410" font-size="25" font-family="sans-serif" fill="#777">其他平台（未来）</text>

  <path d="M320 165C385 165 385 285 445 300M320 295C385 295 385 315 445 320M320 425C385 425 385 355 445 340" fill="none" stroke="#f28b36" stroke-width="6"/>
  <path d="M725 300C785 285 785 240 850 240M725 340C785 355 785 400 850 400" fill="none" stroke="#f28b36" stroke-width="6"/>

  <text x="60" y="555" font-size="22" font-family="sans-serif" fill="#536b68">研究层决定“事实是什么”，平台层决定“怎样呈现”；自动化只负责何时运行。</text>
  <text x="60" y="590" font-size="20" font-family="sans-serif" fill="#536b68">AI 新发现每期只重点介绍一个对象，不做未经核验的榜单或伪实测。</text>
